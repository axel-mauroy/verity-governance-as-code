name: Verity CD (Production Optimized)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # Required for PyPI OIDC Trusted Publishing

# Cancel currently running workflow if a new tag is pushed rapidly
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -------------------------------------------------------------
  # 1. Build & Isolate Artifacts (Matrix)
  # -------------------------------------------------------------
  build-artifacts:
    name: 🏗️ Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            suffix: "linux-x86_64"
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            suffix: "macos-universal"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            suffix: "windows-x86_64"
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 💾 Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 🐍 Python nu, parfait pour Maturin. Aucun gestionnaire de paquets superflu.
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 📦 BUILD Maturin (Gère les Wheels ET génère les binaires dans target/)
      - name: 🎡 Build Verity Core
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out wheel_out --target ${{ matrix.target }} -m verity/Cargo.toml

      - name: 🎡 Build Verity BigQuery
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out wheel_out --target ${{ matrix.target }} -m verity-bigquery/Cargo.toml

      # 🏷️ EXTRACTION des binaires et calcul du SHA256
      - name: 🏷️ Extract Binaries & Calculate SHA
        shell: bash
        run: |
          mkdir -p bin_out
          cp target/${{ matrix.target }}/release/verity${{ matrix.ext }} bin_out/verity-${{ matrix.suffix }}${{ matrix.ext }}
          cp target/${{ matrix.target }}/release/verity-bigquery${{ matrix.ext }} bin_out/verity-bigquery-${{ matrix.suffix }}${{ matrix.ext }}
          
          cd bin_out
          if command -v shasum > /dev/null; then
            shasum -a 256 verity* > checksums-${{ matrix.os }}.txt
          else
            sha256sum verity* > checksums-${{ matrix.os }}.txt
          fi

      - name: 📤 Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: bin_out/*
          retention-days: 1

      - name: 📤 Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheel_out/*
          retention-days: 1

  # -------------------------------------------------------------
  # 2. Publish Binaries to GitHub & Update Homebrew
  # -------------------------------------------------------------
  publish-github:
    name: 🚀 Publish GitHub Release & Update Brew
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main # Ensure we commit formula updates to main

      - name: 📥 Download Binaries
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          pattern: binaries-*
          merge-multiple: true

      - name: 📝 Combine Checksums
        run: |
          cd release_assets
          cat checksums-*.txt > checksums.txt

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🍺 Update Homebrew Formulas
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          VERITY_MAC_SHA=$(grep 'verity-macos-universal' release_assets/checksums.txt | awk '{print $1}')
          VERITY_BQ_MAC_SHA=$(grep 'verity-bigquery-macos-universal' release_assets/checksums.txt | awk '{print $1}')
          
          # Update verity.rb
          sed -i "s|url \".*\"|url \"https://github.com/axel-mauroy/verity-governance-as-code/releases/download/v${VERSION}/verity-macos-universal\"|" Formula/verity.rb
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/verity.rb
          sed -i "s/sha256 \".*\"/sha256 \"${VERITY_MAC_SHA}\"/" Formula/verity.rb

          # Update verity-bigquery.rb
          sed -i "s|url \".*\"|url \"https://github.com/axel-mauroy/verity-governance-as-code/releases/download/v${VERSION}/verity-bigquery-macos-universal\"|" Formula/verity-bigquery.rb
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/verity-bigquery.rb
          sed -i "s/sha256 \".*\"/sha256 \"${VERITY_BQ_MAC_SHA}\"/" Formula/verity-bigquery.rb

      - name: 🚀 Commit & Push Formula Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "chore(brew): update formulas for v${VERSION} [skip ci]" || echo "No changes to commit"
          git push origin main

  # -------------------------------------------------------------
  # 3. Publish Wheels to PyPI (Secure OIDC - Trusted Publishing)
  # -------------------------------------------------------------
  publish-pypi:
    name: 🐍 Publish to PyPI
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: 📥 Download Wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: 🚀 Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
