name: Verity CD (Production Optimized)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # Required for PyPI OIDC Trusted Publishing

# Cancel currently running workflow if a new tag is pushed rapidly
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -------------------------------------------------------------
  # 1. Build & Isolate Artifacts (Matrix)
  # -------------------------------------------------------------
  build-artifacts:
    name: 🏗️ Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 💾 Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 🐍 Python nu, parfait pour Maturin. Aucun gestionnaire de paquets superflu.
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 📦 BUILD Maturin (Gère les Wheels ET génère les binaires dans target/)
      - name: 🎡 Build Verity Core
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out wheel_out --target ${{ matrix.target }} -m verity/Cargo.toml

      - name: 🎡 Build Verity BigQuery
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out wheel_out --target ${{ matrix.target }} -m verity-bigquery/Cargo.toml

      # 🏷️ EXTRACTION des binaires
      - name: 🏷️ Extract Binaries
        shell: bash
        run: |
          mkdir -p bin_out
          cp target/${{ matrix.target }}/release/verity${{ matrix.ext }} bin_out/verity-${{ matrix.os }}${{ matrix.ext }}
          cp target/${{ matrix.target }}/release/verity-bigquery${{ matrix.ext }} bin_out/verity-bigquery-${{ matrix.os }}${{ matrix.ext }}

      - name: 📤 Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: bin_out/*
          retention-days: 1

      - name: 📤 Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheel_out/*
          retention-days: 1

  # -------------------------------------------------------------
  # 2. Publish Binaries to GitHub (Single Job - No Race Conditions)
  # -------------------------------------------------------------
  publish-github:
    name: 🚀 Publish GitHub Release
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download Binaries
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          pattern: binaries-*
          merge-multiple: true

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # 3. Publish Wheels to PyPI (Secure OIDC - Trusted Publishing)
  # -------------------------------------------------------------
  publish-pypi:
    name: 🐍 Publish to PyPI
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: 📥 Download Wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: 🚀 Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release
