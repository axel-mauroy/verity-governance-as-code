name: Verity CD (Releases & PyPI)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -------------------------------------------------------------
  # 1. Native GitHub Releases (Homebrew & script install.sh)
  # -------------------------------------------------------------
  github-release:
    name: 🚀 GitHub Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            suffix: linux-amd64
          - os: macos-latest
            suffix: macos-universal
          - os: windows-latest
            suffix: windows-amd64

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 📦 Cache Dependencies
        uses: swatinem/rust-cache@v2

      - name: 🏗️ Build All Binaries (Release)
        run: cargo build --release

      - name: 🏷️ Rename Binaries for Upload
        shell: bash
        run: |
          mkdir -p assets
          # Extension exe pour Windows
          EXT=""
          if [ "${{ matrix.os }}" == "windows-latest" ]; then EXT=".exe"; fi
          
          # Copie Verity Core
          cp target/release/verity$EXT assets/verity-${{ matrix.suffix }}$EXT
          
          # Copie Verity BigQuery
          cp target/release/verity-bigquery$EXT assets/verity-bigquery-${{ matrix.suffix }}$EXT

      - name: 🚀 Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # 2. PyPI Publish via Maturin
  # -------------------------------------------------------------
  pypi-publish:
    name: 🐍 Publish Wheels to PyPI (${{ matrix.os }})
    needs: github-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 📦 Build & Publish verity-bigquery
        uses: PyO3/maturin-action@v1
        with:
          command: publish
          args: --release -m verity-bigquery/Cargo.toml
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: 📦 Build & Publish verity core
        uses: PyO3/maturin-action@v1
        with:
          command: publish
          args: --release -m verity/Cargo.toml
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
