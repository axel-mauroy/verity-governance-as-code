name: Verity CD (Production Optimized)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for PyPI OIDC Trusted Publishing

# Cancel currently running workflow if a new tag is pushed rapidly
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -------------------------------------------------------------
  # 1. Build & Isolate Artifacts (Matrix)
  # -------------------------------------------------------------
  build-artifacts:
    name: 🏗️ Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            suffix: "linux-x86_64"
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            suffix: "macos-universal"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            suffix: "windows-x86_64"
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 💾 Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 🐍 Python nu, parfait pour Maturin. Aucun gestionnaire de paquets superflu.
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 📦 BUILD Maturin (Gère les Wheels ET génère les binaires dans target/)
      - name: 🎡 Build Verity Core
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out wheel_out --target ${{ matrix.target }} -m verity/Cargo.toml

      - name: 🎡 Build Verity BigQuery
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out wheel_out --target ${{ matrix.target }} -m verity-bigquery/Cargo.toml

      # 🏷️ EXTRACTION des binaires et calcul du SHA256
      - name: 🏷️ Extract Binaries & Calculate SHA
        shell: bash
        run: |
          mkdir -p bin_out
          cp target/${{ matrix.target }}/release/verity${{ matrix.ext }} bin_out/verity-${{ matrix.suffix }}${{ matrix.ext }}
          cp target/${{ matrix.target }}/release/verity-bigquery${{ matrix.ext }} bin_out/verity-bigquery-${{ matrix.suffix }}${{ matrix.ext }}
          
          cd bin_out
          if command -v shasum > /dev/null; then
            shasum -a 256 verity* > checksums-${{ matrix.os }}.txt
          else
            sha256sum verity* > checksums-${{ matrix.os }}.txt
          fi

      - name: 📤 Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: bin_out/*
          retention-days: 1

      - name: 📤 Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheel_out/*
          retention-days: 1

  # -------------------------------------------------------------
  # 2. Publish Binaries to GitHub & Update Homebrew
  # -------------------------------------------------------------
  publish-github:
    name: 🚀 Publish GitHub Release & Update Brew
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main # Ensure we commit formula updates to main

      - name: 📥 Download Binaries
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          pattern: binaries-*
          merge-multiple: true

      - name: 📝 Combine Checksums
        run: |
          cd release_assets
          cat checksums-*.txt > checksums.txt
      - name: 🧹 Cleanup release assets
        run: |
          find release_assets/ -name "checksums-*.txt" -delete
          ls -R release_assets/ # Debug to verify final asset list

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: 🍺 Update Homebrew Formulas
        run: uv run .github/scripts/update_brew.py

      - name: 🔑 Generate ephemeral token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 🍺 Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: 🧪 Test Homebrew Formulas
        run: |
          brew audit --strict --new verity
          brew audit --strict --new verity-bigquery

      - name: 🚀 Create Pull Request for Formula Updates
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(brew): update formulas for v${{ env.VERSION }}"
          title: "chore(brew): update formulas for v${{ env.VERSION }}"
          body: "Automated PR to update Homebrew formulas for the latest release."
          branch: "chore/brew-v${{ env.VERSION }}"
          base: "main"
  # -------------------------------------------------------------
  # 3. Publish Wheels to PyPI (Secure OIDC - Trusted Publishing)
  # -------------------------------------------------------------
  publish-pypi:
    name: 🐍 Publish to PyPI
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: 📥 Download Wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: 🚀 Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
