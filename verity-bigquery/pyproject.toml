[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "verity-bigquery"
dynamic = ["version", "description"]
authors = [
    { name = "Axel MAUROY", email = "axel.mauroy@gmail.com" }
]
readme = "../README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[tool.maturin]
# This tells Maturin that this project is a purely Rust binary, not a Python extension module.
# It will package the compiled `verity-bigquery` binary into the wheel's `bin/` directory
# so it becomes available in the PATH when users `pip install verity-bigquery`.
binding = "bin"
strip = true
